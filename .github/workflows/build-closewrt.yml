name: Build CloseWrt 25.12 (MTK Closed-Source) for CMCC XR30 eMMC

on:
  workflow_dispatch:
    inputs:
      branch_name:
        description: 'chasey-dev 仓库分支名 (默认 25.12)'
        required: true
        default: '25.12'

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: 1. 检出当前仓库
        uses: actions/checkout@v4

      - name: 2. 安装编译环境依赖
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo apt-get update -y
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            python3-setuptools python3-dev rsync unzip zlib1g-dev file wget \
            curl cpio qemu-utils squashfs-tools zstd device-tree-compiler swig time

      - name: 3. 拉取 chasey-dev 闭源驱动源码
        run: |
          PROTO="https"
          HOST="github.com"
          REPO="chasey-dev/immortalwrt-mt798x-rebase.git"
          git clone --depth 1 -b ${{ github.event.inputs.branch_name || '25.12' }} "${PROTO}://${HOST}/${REPO}" openwrt

      - name: 4. 修改底层设备树型号为 CMCC XR30 eMMC version
        working-directory: ./openwrt
        run: |
          sed -i 's/CMCC RAX3000M/CMCC XR30 eMMC version/g' target/linux/mediatek/dts/mt7981b-cmcc-rax3000m*.dts
          sed -i 's/CMCC RAX3000M/CMCC XR30 eMMC version/g' target/linux/mediatek/image/filogic.mk

      - name: 5. 更新并安装软件源 (Feeds)
        working-directory: ./openwrt
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: 6. 生成 XR30 单机型闭源驱动 + 常用插件底层 + NAS 配置
        working-directory: ./openwrt
        run: |
          cp defconfig/mt7981-ax3000.config .config

          # 关闭多机型全量编译，彻底剔除其他小闪存路由器型号，只保留 XR30/RAX3000M
          sed -i 's/CONFIG_TARGET_MULTI_PROFILE=y/# CONFIG_TARGET_MULTI_PROFILE is not set/g' .config
          sed -i 's/CONFIG_TARGET_DEVICE_mediatek_filogic_DEVICE_/# CONFIG_TARGET_DEVICE_mediatek_filogic_DEVICE_/g' .config

          cat << 'EOF' >> .config
          # 锁定目标单机型：CMCC RAX3000M / XR30 eMMC
          CONFIG_TARGET_mediatek_filogic_DEVICE_cmcc_rax3000m=y
          CONFIG_TARGET_DEVICE_mediatek_filogic_DEVICE_cmcc_rax3000m=y

          # 中文界面
          CONFIG_PACKAGE_luci-i18n-base-zh-cn=y
          CONFIG_PACKAGE_luci-i18n-mtwifi-cfg-zh-cn=y
          CONFIG_PACKAGE_luci-i18n-turboacc-mtk-zh-cn=y

          # 常用插件（PassWall 2 / OpenClash / Tailscale / WireGuard）底层内核模块与工具
          CONFIG_PACKAGE_kmod-tun=y
          CONFIG_PACKAGE_kmod-wireguard=y
          CONFIG_PACKAGE_kmod-nft-tproxy=y
          CONFIG_PACKAGE_kmod-nft-socket=y
          CONFIG_PACKAGE_kmod-nft-nat=y
          CONFIG_PACKAGE_kmod-nft-fib=y
          CONFIG_PACKAGE_kmod-inet-diag=y
          CONFIG_PACKAGE_kmod-netlink-diag=y
          CONFIG_PACKAGE_ipset=y
          CONFIG_PACKAGE_ip-full=y
          CONFIG_PACKAGE_chinadns-ng=y
          CONFIG_PACKAGE_ca-bundle=y
          CONFIG_PACKAGE_ca-certificates=y
          CONFIG_PACKAGE_curl=y
          CONFIG_PACKAGE_unzip=y

          # 磁盘管理 (DiskMan) 及全兼容文件系统与编码
          CONFIG_PACKAGE_luci-app-diskman=y
          CONFIG_PACKAGE_luci-i18n-diskman-zh-cn=y
          CONFIG_PACKAGE_e2fsprogs=y
          CONFIG_PACKAGE_parted=y
          CONFIG_PACKAGE_blkid=y
          CONFIG_PACKAGE_lsblk=y
          CONFIG_PACKAGE_kmod-fs-ext4=y
          CONFIG_PACKAGE_kmod-fs-exfat=y
          CONFIG_PACKAGE_kmod-fs-ntfs3=y
          CONFIG_PACKAGE_kmod-fs-vfat=y
          CONFIG_PACKAGE_kmod-nls-utf8=y
          CONFIG_PACKAGE_kmod-nls-cp437=y
          CONFIG_PACKAGE_kmod-nls-iso8859-1=y
          CONFIG_PACKAGE_kmod-usb-storage=y
          CONFIG_PACKAGE_kmod-usb-storage-uas=y

          # 网络共享 (Samba4)
          CONFIG_PACKAGE_luci-app-samba4=y
          CONFIG_PACKAGE_luci-i18n-samba4-zh-cn=y
          CONFIG_PACKAGE_wsdd2=y

          # Transmission 下载器
          CONFIG_PACKAGE_luci-app-transmission=y
          CONFIG_PACKAGE_luci-i18n-transmission-zh-cn=y
          CONFIG_PACKAGE_transmission-daemon=y
          CONFIG_PACKAGE_transmission-web-control=y
          EOF
          make defconfig

      - name: 7. 启用 dl 源码下载缓存加速
        uses: actions/cache@v4
        with:
          path: openwrt/dl
          key: closewrt-dl-${{ github.event.inputs.branch_name || '25.12' }}-${{ hashFiles('openwrt/.config') }}
          restore-keys: |
            closewrt-dl-${{ github.event.inputs.branch_name || '25.12' }}-
            closewrt-dl-

      - name: 8. 预下载并清理残缺源码包
        working-directory: ./openwrt
        run: |
          make download -j8
          find dl -size -1024c -exec rm -f {} \;
          make download -j4

      - name: 9. 开始编译 XR30 单机型闭源驱动固件
        working-directory: ./openwrt
        run: |
          make -j$(nproc)

      - name: 10. 整理并重命名 XR30 固件包
        working-directory: ./openwrt
        run: |
          mkdir -p "$GITHUB_WORKSPACE/release_files"
          cd bin/targets/mediatek/filogic/
          for file in *rax3000m*; do
            [ -e "$file" ] || continue
            newname="${file/rax3000m/xr30-emmc-closewrt}"
            cp "$file" "$GITHUB_WORKSPACE/release_files/$newname"
          done
          ls -lh "$GITHUB_WORKSPACE/release_files/"

      - name: 11. 自动发布固件至 GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: xr30-emmc-closewrt-${{ github.event.inputs.branch_name || '25.12' }}-${{ github.run_number }}
          name: CMCC XR30 eMMC 闭源无线单机型版 (${{ github.event.inputs.branch_name || '25.12' }})
          files: ${{ github.workspace }}/release_files/*
          body: |
            - **源码版本**：`chasey-dev/immortalwrt-mt798x-rebase` (`${{ github.event.inputs.branch_name || '25.12' }}`)
            - **目标机型**：仅编译 `CMCC XR30 eMMC version`（已剔除小闪存机型防溢出）
            - **内置功能**：MTK 闭源 Wi-Fi 与 HWNAT 硬件加速、常用代理/组网底层内核模块、DiskMan、Samba4、Transmission
